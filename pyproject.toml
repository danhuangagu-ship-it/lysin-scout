[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lysin-scout"
version = "0.1.0"
description = "PLM-guided prediction and prioritization of phage endolysin candidates"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy>=1.24,<2", "pandas>=1.5,<3", "torch>=2.1,<2.7", "scikit-learn==1.3.2", "joblib==1.4.2"]

[project.scripts]
lysin-scout = "lysin_scout.predict:main"
lysin-scout-embed = "lysin_scout.embed:main"

[tool.setuptools.packages.find]
include = ["lysin_scout*"]

[tool.setuptools.package-data]
lysin_scout = ["models/*/*.json", "models/*/*.pth", "models/*/*.joblib"]
